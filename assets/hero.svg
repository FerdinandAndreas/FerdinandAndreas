<svg width="850" height="230" viewBox="0 0 850 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Light Blue Gradient Surface -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="50%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Glossy 3D Front Face Gradient -->
    <linearGradient id="front-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Avatar Gradient -->
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <style>
      .card-border { stroke: #60a5fa; stroke-width: 1.5; stroke-opacity: 0.9; }
      .window-title { font: 600 11px 'Courier New', monospace; fill: #0369a1; letter-spacing: 0.5px; }
      .greet-text { font: 700 12px 'Segoe UI', -apple-system, sans-serif; fill: #0284c7; letter-spacing: 2px; }
      
      /* Chunky 3D Name Typography */
      .name-3d {
        font-family: 'Arial Black', Impact, 'Montserrat Black', 'Segoe UI Black', sans-serif;
        font-size: 50px;
        font-weight: 900;
        letter-spacing: 3px;
      }

      .role-text { font: 700 17px 'Segoe UI', -apple-system, sans-serif; fill: #1e40af; }
      
      /* Clean White Tag Pills */
      .pill-box { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.2; }
      .pill-text { font: 700 11px 'Segoe UI', -apple-system, sans-serif; fill: #0369a1; }
      .status-text { font: 700 10px 'Courier New', monospace; fill: #047857; letter-spacing: 0.5px; }

      .beacon-pulse {
        animation: live-pulse 2s ease-in-out infinite;
      }
      .float-avatar {
        animation: float-badge 4s ease-in-out infinite;
      }

      @keyframes live-pulse {
        0%, 100% { opacity: 0.5; r: 3; }
        50% { opacity: 1; r: 4.5; }
      }
      @keyframes float-badge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
    </style>
  </defs>

  <!-- Clean Base Surface Frame -->
  <rect width="850" height="230" rx="14" fill="url(#hero-bg)" class="card-border" />

  <!-- Mac / SaaS Style Window Header Bar -->
  <circle cx="28" cy="20" r="5" fill="#ef4444" opacity="0.9" />
  <circle cx="44" cy="20" r="5" fill="#f59e0b" opacity="0.9" />
  <circle cx="60" cy="20" r="5" fill="#10b981" opacity="0.9" />
  <text x="84" y="24" class="window-title">ferdinand.andreas.dev · web &amp; network workstation</text>
  <line x1="16" y1="36" x2="834" y2="36" stroke="#bfdbfe" stroke-width="1" />

  <!-- Left: Floating Avatar Monogram & Live Status -->
  <g class="float-avatar" transform="translate(75, 112)">
    <circle cx="0" cy="0" r="44" fill="#ffffff" stroke="#93c5fd" stroke-width="2" />
    <circle cx="0" cy="0" r="38" fill="url(#avatar-grad)" stroke="#2563eb" stroke-width="1.5" />
    <text x="0" y="10" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="1px">FA</text>
  </g>

  <!-- Live Status Badge beneath Avatar -->
  <g transform="translate(16, 178)">
    <rect width="118" height="26" rx="13" fill="#ffffff" stroke="#10b981" stroke-width="1.2" />
    <circle cx="15" cy="13" class="beacon-pulse" fill="#10b981" />
    <text x="26" y="17" class="status-text">AVAILABLE</text>
  </g>

  <!-- Right: Identity, 3D Name, Role & Core Capsules -->
  <!-- Greeting -->
  <text x="165" y="70" class="greet-text">HELLO WORLD, I'M</text>

  <!-- Chunky 3D Name Extrusion -->
  <g>
    <!-- 3D Shadow Layers -->
    <text x="165" y="122" class="name-3d" fill="#081430">Ferdinand Andreas</text>
    <text x="165" y="120" class="name-3d" fill="#0d2354">Ferdinand Andreas</text>
    <text x="165" y="118" class="name-3d" fill="#12357a">Ferdinand Andreas</text>
    <text x="165" y="116" class="name-3d" fill="#1a49a5">Ferdinand Andreas</text>
    <text x="165" y="114" class="name-3d" fill="#2563eb">Ferdinand Andreas</text>
    <!-- 3D Front Face -->
    <text x="165" y="112" class="name-3d" fill="url(#front-face)" stroke="#ffffff" stroke-width="1.8">Ferdinand Andreas</text>
  </g>

  <!-- Primary Role -->
  <text x="165" y="148" class="role-text">Web Developer &amp; Network Engineer</text>

  <!-- Unified Tech Capsules (With Database Exclusively as Supabase) -->
  <g transform="translate(165, 172)">
    <!-- Capsule 1: Web -->
    <rect width="135" height="28" rx="6" class="pill-box" />
    <circle cx="14" cy="14" r="3" fill="#0284c7" />
    <text x="76" y="18" text-anchor="middle" class="pill-text">React &amp; Next.js</text>

    <!-- Capsule 2: Network -->
    <rect x="145" width="160" height="28" rx="6" class="pill-box" />
    <circle cx="159" cy="14" r="3" fill="#10b981" />
    <text x="232" y="18" text-anchor="middle" class="pill-text">Computer Networking</text>

    <!-- Capsule 3: Supabase Exclusively -->
    <rect x="315" width="105" height="28" rx="6" class="pill-box" />
    <circle cx="329" cy="14" r="3" fill="#3ecf8e" />
    <text x="372" y="18" text-anchor="middle" class="pill-text">Supabase</text>

    <!-- Capsule 4: UI/UX -->
    <rect x="430" width="125" height="28" rx="6" class="pill-box" />
    <circle cx="444" cy="14" r="3" fill="#8b5cf6" />
    <text x="498" y="18" text-anchor="middle" class="pill-text">UI/UX Design</text>
  </g>
</svg>
