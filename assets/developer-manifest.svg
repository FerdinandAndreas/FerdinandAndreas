<svg width="850" height="350" viewBox="0 0 850 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Light Sky Blue Outer Gradient -->
    <linearGradient id="manifest-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="60%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <style>
      .panel-border { stroke: #60a5fa; stroke-width: 1.5; stroke-opacity: 0.85; }
      .code-card { fill: #ffffff; stroke: #bfdbfe; stroke-width: 1.2; }
      
      /* Code Syntax Highlighting */
      .code-font { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; }
      .kw { fill: #2563eb; font-weight: 700; }
      .prop { fill: #0f172a; font-weight: 600; }
      .str { fill: #059669; font-weight: 600; }
      .type { fill: #0284c7; font-weight: 700; }
      .comment { fill: #64748b; font-style: italic; }
      
      /* Network Telemetry Typography */
      .tele-title { font: 700 12px 'Courier New', monospace; fill: #0369a1; letter-spacing: 1px; }
      .tele-line { font: 600 11px 'Courier New', monospace; fill: #1e3a8a; }
      .tele-accent { font: 700 11px 'Courier New', monospace; fill: #0284c7; }
      .tele-green { font: 700 11px 'Courier New', monospace; fill: #059669; }

      .scanline {
        fill: #38bdf8;
        opacity: 0.18;
        animation: scan 4s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(0px); }
        100% { transform: translateY(240px); }
      }
    </style>
  </defs>

  <!-- Outer Canvas Frame in Soft Sky Blue -->
  <rect width="850" height="350" rx="14" fill="url(#manifest-bg)" class="panel-border" />

  <!-- Left: Developer Code Window (developer.ts) -->
  <g transform="translate(20, 20)">
    <rect width="400" height="310" rx="10" class="code-card" />
    <!-- Window Bar -->
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.9" />
    <circle cx="34" cy="18" r="4.5" fill="#f59e0b" opacity="0.9" />
    <circle cx="48" cy="18" r="4.5" fill="#10b981" opacity="0.9" />
    <text x="68" y="22" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#0369a1">developer.ts</text>
    <line x1="12" y1="32" x2="388" y2="32" stroke="#e2e8f0" stroke-width="1" />

    <!-- Code Content -->
    <g transform="translate(18, 56)" class="code-font">
      <text y="0"><tspan class="comment">// Developer Identity &amp; Core Stack</tspan></text>
      <text y="20"><tspan class="kw">const</tspan> <tspan class="prop">developer</tspan>: <tspan class="type">Engineer</tspan> = {</text>
      <text y="40"><tspan class="prop">  name</tspan>: <tspan class="str">"Ferdinand Andreas"</tspan>,</text>
      <text y="60"><tspan class="prop">  location</tspan>: <tspan class="str">"Indonesia (UTC+7)"</tspan>,</text>
      <text y="80"><tspan class="prop">  disciplines</tspan>: [</text>
      <text y="100">    <tspan class="str">"Web Engineering"</tspan>,</text>
      <text y="120">    <tspan class="str">"Computer Networking"</tspan></text>
      <text y="140">  ],</text>
      <text y="160"><tspan class="prop">  stack</tspan>: {</text>
      <text y="180"><tspan class="prop">    web</tspan>: [<tspan class="str">"React"</tspan>, <tspan class="str">"Next.js"</tspan>, <tspan class="str">"Node"</tspan>],</text>
      <text y="200"><tspan class="prop">    network</tspan>: [<tspan class="str">"TCP/IP"</tspan>, <tspan class="str">"Wireshark"</tspan>],</text>
      <text y="220"><tspan class="prop">    cloud</tspan>: [<tspan class="str">"Supabase"</tspan>, <tspan class="str">"Firebase"</tspan>]</text>
      <text y="240">  }</text>
      <text y="254">};</text>
    </g>
  </g>

  <!-- Right: Network Architecture & Telemetry (network-telemetry.sys) -->
  <g transform="translate(430, 20)">
    <rect width="400" height="310" rx="10" class="code-card" />
    <!-- Window Bar -->
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.9" />
    <circle cx="34" cy="18" r="4.5" fill="#f59e0b" opacity="0.9" />
    <circle cx="48" cy="18" r="4.5" fill="#10b981" opacity="0.9" />
    <text x="68" y="22" class="tele-title">network-telemetry.sys</text>
    <line x1="12" y1="32" x2="388" y2="32" stroke="#e2e8f0" stroke-width="1" />

    <!-- Terminal Lines -->
    <g transform="translate(18, 56)">
      <text y="0" class="tele-accent">$ target --inspect network-infrastructure</text>
      <text y="24" class="tele-line">[PROTOCOLS] TCP/IP · HTTP/3 · WebSockets · MQTT</text>
      <text y="44" class="tele-line">[LAB TOOLS] Wireshark · Packet Flow · Routing</text>
      <text y="64" class="tele-line">[SYSTEM]    Linux Workstation · Docker Containers</text>
      <text y="84" class="tele-line">[DATABASE]  Supabase Realtime · Cloud Firestore</text>

      <!-- Divider -->
      <line x1="0" y1="102" x2="364" y2="102" stroke="#e2e8f0" stroke-width="1" />

      <text y="122" class="tele-accent">$ status --verified-checks</text>
      <text y="146" class="tele-green">&#x2714; High-Performance Web Frontend (Next.js)</text>
      <text y="168" class="tele-green">&#x2714; Resilient Network Protocols &amp; Analysis</text>
      <text y="190" class="tele-green">&#x2714; Real-Time Cloud Database Synchronized</text>
      <text y="212" class="tele-green">&#x2714; Human-Centric UI/UX Design System</text>

      <text y="242" class="tele-accent">&gt; All engineering telemetry nodes online.</text>
    </g>

    <!-- Scan Bar Animation -->
    <rect x="12" y="34" width="376" height="12" class="scanline" />
  </g>
</svg>
