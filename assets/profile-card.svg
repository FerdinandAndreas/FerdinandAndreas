<svg width="850" height="170" viewBox="0 0 850 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Light Blue Gradient Surface -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="50%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <style>
      .card-border { stroke: #60a5fa; stroke-width: 1.5; stroke-opacity: 0.85; }
      .handle { font: 700 13px 'Segoe UI', -apple-system, sans-serif; fill: #0284c7; letter-spacing: 0.5px; }
      .fullname { font: 800 26px 'Segoe UI', -apple-system, sans-serif; fill: #0f172a; letter-spacing: 0.2px; }
      .role-title { font: 600 15px 'Segoe UI', -apple-system, sans-serif; fill: #1e40af; }
      
      /* Professional Light Tags */
      .tag-box { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.2; }
      .tag-text { font: 700 12px 'Segoe UI', -apple-system, sans-serif; fill: #0369a1; }
      .tag-text-green { font: 700 12px 'Segoe UI', -apple-system, sans-serif; fill: #065f46; }

      /* Minimal Live Indicator */
      .status-text { font: 600 12px 'Segoe UI', -apple-system, sans-serif; fill: #047857; }
    </style>
  </defs>

  <!-- Clean Light Blue Base Surface -->
  <rect width="850" height="170" rx="12" fill="url(#card-bg)" class="card-border" />

  <!-- Avatar Badge (FA) - Vibrant Royal Blue on Light Background -->
  <circle cx="80" cy="85" r="42" fill="#2563eb" stroke="#60a5fa" stroke-width="2" />
  <text x="80" y="95" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="1px">FA</text>

  <!-- User Identity & Focus -->
  <g transform="translate(148, 48)">
    <!-- Handle -->
    <text y="0" class="handle">@FerdinandAndreas</text>

    <!-- Full Name -->
    <text y="30" class="fullname">Ferdinand Andreas Saputra</text>

    <!-- Clear, Simple Primary Title -->
    <text y="54" class="role-title">Web Developer &amp; Network Engineer</text>
  </g>

  <!-- The 2 Core Disciplines (Web Developer & Networking) -->
  <g transform="translate(148, 120)">
    <!-- Tag 1: Web Development -->
    <rect width="150" height="26" rx="5" class="tag-box" />
    <circle cx="16" cy="13" r="3" fill="#0284c7" />
    <text x="88" y="17" text-anchor="middle" class="tag-text">Web Development</text>

    <!-- Tag 2: Computer Networking -->
    <rect x="162" width="165" height="26" rx="5" class="tag-box" />
    <circle cx="178" cy="13" r="3" fill="#10b981" />
    <text x="250" y="17" text-anchor="middle" class="tag-text-green">Computer Networking</text>
  </g>

  <!-- Minimal Clean Status on Right Side -->
  <g transform="translate(670, 52)">
    <circle cx="10" cy="10" r="3.5" fill="#10b981" />
    <text x="20" y="14" class="status-text">Available for Projects</text>
  </g>
</svg>
