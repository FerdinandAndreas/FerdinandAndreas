<svg width="850" height="370" viewBox="0 0 850 370" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scan-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080f24" />
      <stop offset="60%" stop-color="#0b1736" />
      <stop offset="100%" stop-color="#091228" />
    </linearGradient>
    <style>
      .panel { fill: url(#scan-bg); stroke: #1e40af; stroke-width: 1.5; stroke-opacity: 0.8; }
      .sub-panel { fill: #0d1a3a; stroke: #1e3a8a; stroke-width: 1; stroke-opacity: 0.6; }
      .header-title { font: 700 13px 'Courier New', monospace; fill: #38bdf8; letter-spacing: 1.5px; }
      .label { font: 500 12px 'Courier New', monospace; fill: #7dd3fc; }
      .val { font: 600 12px 'Segoe UI', sans-serif; fill: #ffffff; }
      .val-code { font: 600 12px 'Courier New', monospace; fill: #e0f2fe; }
      .val-accent { font: 700 12px 'Segoe UI', sans-serif; fill: #38bdf8; }
      .val-green { font: 600 12px 'Segoe UI', sans-serif; fill: #34d399; }
      .val-amber { font: 600 12px 'Segoe UI', sans-serif; fill: #fbbf24; }
      
      .terminal-code { font: 600 11px 'Courier New', monospace; fill: #93c5fd; }
      .terminal-prompt { font: 700 11px 'Courier New', monospace; fill: #38bdf8; }
      .terminal-highlight { font: 700 11px 'Courier New', monospace; fill: #34d399; }
      
      .scanline {
        fill: #38bdf8;
        opacity: 0.14;
        animation: scan 4s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(0px); }
        100% { transform: translateY(260px); }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="850" height="370" rx="14" class="panel" />

  <!-- Left Panel: DEV & IOT TELEMETRY -->
  <rect x="22" y="20" width="350" height="330" rx="8" class="sub-panel" />
  
  <!-- Window Controls -->
  <circle cx="42" cy="40" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="58" cy="40" r="5" fill="#fbbf24" opacity="0.8" />
  <circle cx="74" cy="40" r="5" fill="#10b981" opacity="0.8" />
  <text x="96" y="44" class="header-title">STACK &amp; IOT TELEMETRY</text>
  <line x1="32" y1="56" x2="362" y2="56" stroke="#1e3a8a" stroke-opacity="0.7" />

  <!-- Terminal Telemetry Content -->
  <g transform="translate(36, 78)">
    <text y="0" class="terminal-prompt">$</text>
    <text x="16" y="0" class="terminal-code">inspect --capabilities --full</text>
    
    <text y="24" class="terminal-code">[PLATFORM] Web: React · Next.js · Node.js</text>
    <text y="44" class="terminal-code">[PLATFORM] Mobile: Flutter · Kotlin</text>
    <text y="64" class="terminal-code">[DATABASE] Supabase · Firebase · NoSQL</text>
    <text y="84" class="terminal-code">[HARDWARE] IoT: ESP32 · Sensors · MQTT</text>
    <text y="104" class="terminal-code">[NETWORK]  Traffic Analysis · Protocols</text>

    <!-- Radar Separator -->
    <line x1="0" y1="120" x2="320" y2="120" stroke="#1e3a8a" stroke-opacity="0.5" />
    
    <text y="138" class="terminal-prompt">$</text>
    <text x="16" y="138" class="terminal-code">status --active-pipelines</text>

    <text y="160" class="terminal-highlight">&#x2714; Mobile &amp; Web Apps: Flutter, React, Next.js</text>
    <text y="180" class="terminal-highlight">&#x2714; Cloud DB: Supabase, Firebase &amp; NoSQL</text>
    <text y="200" class="terminal-highlight">&#x2714; IoT Systems: ESP32 &amp; Sensor Telemetry</text>
    <text y="220" class="terminal-highlight">&#x2714; UI/UX Architecture &amp; Network Labs</text>
    
    <text y="246" class="terminal-code">&gt; Status: All engineering nodes connected.</text>
  </g>
  
  <!-- Scanning Light Line -->
  <rect x="23" y="58" width="348" height="12" class="scanline" />

  <!-- Right Panel: ENGINEERING PROFILE SPECS -->
  <rect x="388" y="20" width="440" height="330" rx="8" class="sub-panel" />
  <text x="408" y="44" class="header-title">ENGINEERING SPECS</text>
  <line x1="408" y1="56" x2="812" y2="56" stroke="#1e3a8a" stroke-opacity="0.7" />

  <!-- Data Specification Rows -->
  <g transform="translate(408, 80)">
    <text y="0" class="label">Developer</text>
    <text x="135" y="0" class="val">Ferdinand Andreas Saputra</text>

    <text y="24" class="label">Identity</text>
    <text x="135" y="24" class="val-accent">@FerdinandAndreas</text>

    <text y="48" class="label">Primary Focus</text>
    <text x="135" y="48" class="val">Web &amp; Mobile · IoT Systems · UI/UX</text>

    <text y="72" class="label">Mobile Apps</text>
    <text x="135" y="72" class="val-code">Flutter (Dart), Kotlin, Android Studio</text>

    <text y="96" class="label">Web Frontend</text>
    <text x="135" y="96" class="val-code">React, Next.js, HTML5, CSS3, Tailwind</text>

    <text y="120" class="label">Databases</text>
    <text x="135" y="120" class="val-amber">Supabase, Firebase, NoSQL</text>

    <text y="144" class="label">IoT &amp; Hardware</text>
    <text x="135" y="144" class="val-green">ESP32, Arduino, MQTT, Sensors</text>

    <text y="168" class="label">Backend &amp; Core</text>
    <text x="135" y="168" class="val-code">Node.js, PHP, Python, C++</text>

    <text y="192" class="label">Networking</text>
    <text x="135" y="192" class="val">Computer Networks · Protocol Inspection</text>

    <text y="216" class="label">Design Focus</text>
    <text x="135" y="216" class="val">UI/UX Design · Responsive Layouts · Figma</text>

    <text y="240" class="label">Status</text>
    <text x="135" y="240" class="val-green">Building Connected Web, Mobile &amp; IoT</text>
  </g>
</svg>
