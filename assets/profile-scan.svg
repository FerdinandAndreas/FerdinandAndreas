<svg width="850" height="370" viewBox="0 0 850 370" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Light Sky Blue Outer Gradient -->
    <linearGradient id="scan-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="60%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <style>
      .panel { fill: url(#scan-bg); stroke: #60a5fa; stroke-width: 1.5; stroke-opacity: 0.85; }
      .sub-panel { fill: #ffffff; stroke: #bfdbfe; stroke-width: 1.2; }
      .header-title { font: 700 13px 'Courier New', monospace; fill: #0369a1; letter-spacing: 1.5px; }
      .label { font: 600 12px 'Courier New', monospace; fill: #0284c7; }
      .val { font: 700 12px 'Segoe UI', sans-serif; fill: #0f172a; }
      .val-code { font: 600 12px 'Courier New', monospace; fill: #1e3a8a; }
      .val-accent { font: 700 12px 'Segoe UI', sans-serif; fill: #0284c7; }
      .val-green { font: 700 12px 'Segoe UI', sans-serif; fill: #059669; }
      .val-amber { font: 700 12px 'Segoe UI', sans-serif; fill: #b45309; }
      
      .terminal-code { font: 600 11px 'Courier New', monospace; fill: #1e3a8a; }
      .terminal-prompt { font: 700 11px 'Courier New', monospace; fill: #0284c7; }
      .terminal-highlight { font: 700 11px 'Courier New', monospace; fill: #059669; }
      
      .scanline {
        fill: #38bdf8;
        opacity: 0.2;
        animation: scan 4s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(0px); }
        100% { transform: translateY(260px); }
      }
    </style>
  </defs>

  <!-- Outer Frame in Light Blue -->
  <rect width="850" height="370" rx="14" class="panel" />

  <!-- Left Panel: White Sub-panel Card -->
  <rect x="22" y="20" width="350" height="330" rx="8" class="sub-panel" />
  
  <!-- Window Controls -->
  <circle cx="42" cy="40" r="5" fill="#ef4444" opacity="0.9" />
  <circle cx="58" cy="40" r="5" fill="#f59e0b" opacity="0.9" />
  <circle cx="74" cy="40" r="5" fill="#10b981" opacity="0.9" />
  <text x="96" y="44" class="header-title">STACK &amp; NETWORKING TELEMETRY</text>
  <line x1="32" y1="56" x2="362" y2="56" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- Terminal Telemetry Content -->
  <g transform="translate(36, 78)">
    <text y="0" class="terminal-prompt">$</text>
    <text x="16" y="0" class="terminal-code">inspect --capabilities --full</text>
    
    <text y="24" class="terminal-code">[BACKEND]  Django · Laravel · Node · PHP</text>
    <text y="44" class="terminal-code">[NETWORK]  Winbox (MikroTik) · Wireshark</text>
    <text y="64" class="terminal-code">[AI / ML]  Machine Learning · Scikit-Learn</text>
    <text y="84" class="terminal-code">[TOOLING]  Docker · Git · Notion · Linux</text>
    <text y="104" class="terminal-code">[DATABASE] Supabase · Firebase · NoSQL</text>

    <!-- Separator -->
    <line x1="0" y1="120" x2="320" y2="120" stroke="#e2e8f0" stroke-width="1.2" />
    
    <text y="138" class="terminal-prompt">$</text>
    <text x="16" y="138" class="terminal-code">status --active-pipelines</text>

    <text y="160" class="terminal-highlight">&#x2714; Full-Stack: Django, Laravel, React, Next</text>
    <text y="180" class="terminal-highlight">&#x2714; Machine Learning &amp; Applied AI Models</text>
    <text y="200" class="terminal-highlight">&#x2714; Network: Winbox Routing &amp; Traffic Logs</text>
    <text y="220" class="terminal-highlight">&#x2714; Containerized Workflows (Docker)</text>
    
    <text y="246" class="terminal-code">&gt; Status: All verified pipelines active.</text>
  </g>
  
  <!-- Scanning Light Line -->
  <rect x="23" y="58" width="348" height="12" class="scanline" />

  <!-- Right Panel: White Sub-panel Card -->
  <rect x="388" y="20" width="440" height="330" rx="8" class="sub-panel" />
  <text x="408" y="44" class="header-title">ENGINEERING SPECS</text>
  <line x1="408" y1="56" x2="812" y2="56" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- Data Specification Rows -->
  <g transform="translate(408, 80)">
    <text y="0" class="label">Developer</text>
    <text x="135" y="0" class="val">Ferdinand Andreas Saputra</text>

    <text y="24" class="label">Identity</text>
    <text x="135" y="24" class="val-accent">@FerdinandAndreas</text>

    <text y="48" class="label">Primary Roles</text>
    <text x="135" y="48" class="val">Web &amp; Network Engineer · AI Explorer</text>

    <text y="72" class="label">Backend</text>
    <text x="135" y="72" class="val-code">Django, Laravel, Node.js, PHP, Python</text>

    <text y="96" class="label">Frontend</text>
    <text x="135" y="96" class="val-code">React, Next.js, HTML5, CSS3, Tailwind</text>

    <text y="120" class="label">Networking</text>
    <text x="135" y="120" class="val-green">Winbox (MikroTik), Wireshark, Protocols</text>

    <text y="144" class="label">Machine Learning</text>
    <text x="135" y="144" class="val-amber">ML Regression/Classif, Scikit-Learn</text>

    <text y="168" class="label">Containers &amp; Ops</text>
    <text x="135" y="168" class="val-code">Docker, Git, Linux Lab, Notion</text>

    <text y="192" class="label">Databases</text>
    <text x="135" y="192" class="val-accent">Supabase, Firebase, NoSQL</text>

    <text y="216" class="label">Design &amp; UI/UX</text>
    <text x="135" y="216" class="val">Figma · Wireframing · Design Systems</text>

    <text y="240" class="label">Status</text>
    <text x="135" y="240" class="val-green">Building Scalable Web, Network &amp; AI</text>
  </g>
</svg>
