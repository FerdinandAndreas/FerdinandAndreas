<svg width="850" height="160" viewBox="0 0 850 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Light Blue Gradient Surface -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="50%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Glossy 3D Front Face Gradient -->
    <linearGradient id="front-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="28%" stop-color="#e0f2fe" />
      <stop offset="68%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Ambient 3D Floor Shadow Filter -->
    <filter id="floor-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
    </filter>

    <style>
      .card-border { stroke: #60a5fa; stroke-width: 1.5; stroke-opacity: 0.85; }
      
      /* Chunky, Fat 3D Typography */
      .text-3d {
        font-family: 'Arial Black', Impact, 'Montserrat Black', 'Segoe UI Black', sans-serif;
        font-size: 82px;
        font-weight: 900;
        letter-spacing: 5px;
        text-anchor: middle;
      }

      /* Smooth Floating 3D Animation */
      .float-layer {
        animation: float3d 4s ease-in-out infinite;
      }
      .shadow-pulse {
        animation: shadowScale 4s ease-in-out infinite;
      }

      @keyframes float3d {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes shadowScale {
        0%, 100% { transform: scale(1); opacity: 0.22; }
        50% { transform: scale(0.92); opacity: 0.12; }
      }
    </style>
  </defs>

  <!-- Clean Base Surface -->
  <rect width="850" height="160" rx="14" fill="url(#banner-bg)" class="card-border" />

  <!-- Subtle Modern Header Tech Accent -->
  <line x1="24" y1="20" x2="84" y2="20" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
  <line x1="92" y1="20" x2="124" y2="20" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Ambient 3D Ground Shadow -->
  <g transform="translate(425, 134)" class="shadow-pulse">
    <ellipse cx="0" cy="0" rx="250" ry="12" fill="#1e3a8a" filter="url(#floor-shadow)" />
  </g>

  <!-- 3D Bold Floating Typography Stack -->
  <g class="float-layer">
    <!-- Depth Layer 6 (Deep Base) -->
    <text x="50%" y="108" class="text-3d" fill="#081430">FERDINAND</text>
    
    <!-- Depth Layer 5 -->
    <text x="50%" y="106" class="text-3d" fill="#0d2354">FERDINAND</text>

    <!-- Depth Layer 4 -->
    <text x="50%" y="104" class="text-3d" fill="#12357a">FERDINAND</text>

    <!-- Depth Layer 3 -->
    <text x="50%" y="102" class="text-3d" fill="#1a49a5">FERDINAND</text>

    <!-- Depth Layer 2 -->
    <text x="50%" y="100" class="text-3d" fill="#2563eb">FERDINAND</text>

    <!-- Depth Layer 1 (Upper Bevel) -->
    <text x="50%" y="98" class="text-3d" fill="#3b82f6">FERDINAND</text>

    <!-- Front Face with Glossy Bevel Reflection & White Rim -->
    <text x="50%" y="96" class="text-3d" fill="url(#front-face)" stroke="#ffffff" stroke-width="1.8">FERDINAND</text>
  </g>
</svg>
