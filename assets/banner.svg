<svg width="850" height="150" viewBox="0 0 850 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080f24" />
      <stop offset="50%" stop-color="#0d1b3e" />
      <stop offset="100%" stop-color="#0a1329" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#93c5fd" />
    </pattern>
    <style>
      .card-border { stroke: #2563eb; stroke-width: 1.5; stroke-opacity: 0.6; }
      .name-text {
        font-family: 'Courier New', Courier, monospace;
        font-size: 74px;
        font-weight: 900;
        letter-spacing: 12px;
        fill: url(#dots);
        stroke: #38bdf8;
        stroke-width: 0.8;
        stroke-opacity: 0.7;
      }
      .reveal {
        animation: typing 3.5s steps(20, end) infinite alternate;
      }
      @keyframes typing {
        0%, 15% { width: 0; }
        80%, 100% { width: 850px; }
      }
    </style>
    <clipPath id="clip-typing">
      <rect class="reveal" x="0" y="0" width="850" height="150" />
    </clipPath>
  </defs>

  <!-- Background Panel with Royal Tech Border -->
  <rect width="850" height="150" rx="14" fill="url(#banner-bg)" class="card-border" />
  
  <!-- Subtle Header Tech Accent Line -->
  <line x1="20" y1="18" x2="80" y2="18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="88" y1="18" x2="120" y2="18" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Animated Typing Text -->
  <g clip-path="url(#clip-typing)">
    <text x="50%" y="98" text-anchor="middle" class="name-text">FERDINAND</text>
  </g>
</svg>
