<svg width="850" height="210" viewBox="0 0 850 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Light Sky Blue Gradient Background -->
    <linearGradient id="activity-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="50%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Wave Telemetry Gradient -->
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.4" />
    </linearGradient>

    <style>
      .card-border { stroke: #60a5fa; stroke-width: 1.5; stroke-opacity: 0.85; }
      .header-title { font: 800 15px 'Segoe UI', -apple-system, sans-serif; fill: #0f172a; letter-spacing: 0.3px; }
      .header-sub { font: 500 12px 'Segoe UI', -apple-system, sans-serif; fill: #1e40af; }
      .metric-label { font: 700 11px 'Courier New', monospace; fill: #0284c7; }
      .metric-val { font: 700 11px 'Segoe UI', sans-serif; fill: #0f172a; }
      .metric-green { font: 700 11px 'Segoe UI', sans-serif; fill: #059669; }

      /* Telemetry Scan Wave Animation */
      .scan-beam {
        animation: telemetry-sweep 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .beacon-pulse {
        animation: live-pulse 2s ease-in-out infinite;
      }

      @keyframes telemetry-sweep {
        0% { transform: translateX(0px); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateX(780px); opacity: 0; }
      }
      @keyframes live-pulse {
        0%, 100% { opacity: 0.5; r: 3; }
        50% { opacity: 1; r: 4.5; }
      }
    </style>
  </defs>

  <!-- Base Card Frame in Light Blue -->
  <rect width="850" height="210" rx="14" fill="url(#activity-bg)" class="card-border" />

  <!-- Top Header Section -->
  <text x="28" y="34" class="header-title">Continuous Engineering &amp; Telemetry Stream</text>
  <text x="28" y="52" class="header-sub">Active development across Mobile, Web, IoT Hardware nodes &amp; Supabase Cloud</text>

  <!-- Status Indicator Badge (Top Right) -->
