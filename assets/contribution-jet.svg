    <rect width="137" height="26" rx="13" fill="#ffffff" stroke="#10b981" stroke-width="1.2" />
    <circle cx="16" cy="13" class="beacon-pulse" fill="#10b981" />
    <text x="28" y="17" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#047857">STREAM ACTIVE</text>
  </g>

  <!-- Header Separator Line -->
